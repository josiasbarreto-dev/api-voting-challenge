services:
  mysql:
    image: mysql:8
    container_name: voting_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: ../cpf-api-client
      dockerfile: Dockerfile
    image: cpf-api-client:latest
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 40s

  voting_app_service:
    build: .
    depends_on:
      mysql:
        condition: service_healthy   # ✅ só sobe quando MySQL estiver "UP"
      app:
        condition: service_healthy   # ✅ só sobe quando API CPF estiver "UP"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  db_data: